version: "3.9"

services:
  portfolio:
    container_name: ilham-portfolio
    build: .
    restart: always
    environment:
      - NODE_ENV=production
    expose:
      - "3000" 
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: ilham-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portfolio
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
